name: Fluter CI

# Trigger this workflow on pushes and pull requests to the main/master branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (required if your Flutter app builds Android APKs/App Bundles)
      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up the Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      # 4. Install project dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Run code analyzer / linter (optional, but recommended)
      - name: Analyze code
        run: flutter analyze

      # 6. Run unit and widget tests
      - name: Run tests
        run: flutter test

      # 7. Build Android APK
      - name: Build APK
        run: flutter build apk --release

